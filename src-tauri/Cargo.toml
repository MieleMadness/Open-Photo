[package]
name = "open-photo"
version = "0.56.17"
description = "Offline-first Windows photo organizer"
authors = ["Open-Photo contributors"]
edition = "2021"

[lib]
name = "open_photo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "avif"] }
base64 = "0.22"
kamadak-exif = "0.6"
nom-exif = "3.8"
raw-files = "0.5"
opener = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
dirs = "5"
notify = "8"
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

# Parse RDF by namespace while preserving unrelated XML verbatim.
roxmltree = "0.21"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }
