name: Sync updater dependency locks

on:
  push:
    branches: [feature/desktop-v0.1.0]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - .github/workflows/sync-updater-locks.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/desktop-v0.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Update JavaScript dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve Rust dependency lock
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Commit generated lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfiles already synchronized."
            exit 0
          }
          git commit -m "Sync updater dependency lockfiles"
          git push origin HEAD:feature/desktop-v0.1.0
