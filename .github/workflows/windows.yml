name: Open-Photo 0.56.21 · Windows Desktop Build
run-name: "${{ github.event.pull_request.title || format('Open-Photo {0}', github.ref_name) }} · CI #${{ github.run_number }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openphoto-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify build versions
        shell: pwsh
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (!$npm -or $npm -ne $tauri -or $npm -ne $cargo.Matches.Groups[1].Value) { throw 'Build versions differ' }
      - run: npm test
      - run: npm run build

  rust:
    name: Rust checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-validation
          cache-on-failure: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ai-model-cache
          key: ai-models-v1-${{ hashFiles('config/ai-models.json') }}
      - run: npm run prepare:models
      - run: npm run prepare:video
      - run: npm run tauri icon assets/app-icon.svg
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  windows:
    name: Build on Windows
    needs: [frontend, rust]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-installer
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ai-model-cache
          key: ai-models-v1-${{ hashFiles('config/ai-models.json') }}
      - run: npm run prepare:models
      - run: npm run prepare:video
      - run: npm run tauri icon assets/app-icon.svg
      - name: Build Windows desktop installer
        run: npm run tauri build -- -- --locked
      - name: Measure release video export
        shell: pwsh
        run: ./scripts/accept-video.ps1 -OutputDirectory "$env:RUNNER_TEMP/openphoto-video-acceptance" -MachineLabel "GitHub Windows 2022 runner"
      - name: Verify installed AI and uninstall lifecycle
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-installed-app.ps1 -Installer "src-tauri/target/release/bundle/nsis/Open-Photo_${version}_x64-setup.exe" -ReportDirectory "$env:RUNNER_TEMP/openphoto-installed-acceptance"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: open-photo-installed-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/openphoto-installed-acceptance/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: open-photo-video-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/openphoto-video-acceptance/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          compression-level: 0
          name: open-photo-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
