name: Windows Desktop Build
run-name: ${{ github.event.pull_request.title || format('Open-Photo {0}', github.ref_name) }} · CI #${{ github.run_number }}
concurrency:
  group: openphoto-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify consistent build version
        shell: pwsh
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $rust = $cargo.Matches.Groups[1].Value
          if (!$npm -or $npm -ne $tauri -or $npm -ne $rust) {
            throw "Version mismatch: npm=$npm, Tauri=$tauri, Cargo=$rust"
          }
          Write-Output "Consistent Open-Photo version: $npm"
      - name: Check Rust formatting (fail fast)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Typecheck and build frontend
        run: npm run build
      - name: Generate app icons from maintained SVG source
        run: npm run tauri icon assets/app-icon.svg
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows desktop installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: open-photo-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
