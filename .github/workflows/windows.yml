name: Open-Photo 0.56.88 · Windows Desktop Build
run-name: "Open-Photo 0.56.88 · Windows Desktop Build · CI #${{ github.run_number }}"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/desktop-v0.1.0]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      full_windows:
        description: 'Build installer and run complete Windows installed-app verification'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: openphoto-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify build versions
        shell: pwsh
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (!$npm -or $npm -ne $tauri -or $npm -ne $cargo.Matches.Groups[1].Value) { throw 'Build versions differ' }
      - run: npm test
      - run: npm run build

  rust:
    name: Rust checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Rust formatting check (fail fast)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-validation
          cache-on-failure: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ai-model-cache
          key: ai-models-v1-${{ hashFiles('config/ai-models.json') }}
      - name: Verify bundled AI models (cached)
        run: npm run prepare:models
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ve
          key: video-engine-windows-v1-${{ hashFiles('scripts/prepare-video-engine.ps1') }}
      - name: Prepare bundled video engine (cached)
        run: npm run prepare:video
      - run: npm run tauri icon assets/app-icon.svg
      - name: Rust lint (Clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Native Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --show-output
      - name: Short real-model video staging and resume acceptance
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib video_semantic::tests::video_embeddings_resume_staging_and_publish_with_the_real_bundled_model -- --exact --ignored --nocapture --test-threads=1
      - name: Publish PR verification summary
        if: always()
        shell: pwsh
        run: |
          @(
            '## Open-Photo Windows verification'
            ''
            "- **Run:** #${{ github.run_number }}"
            "- **Commit:** ${{ github.sha }}"
            '- **Frontend:** npm tests and production build'
            '- **Rust:** formatting, Clippy and native regression tests'
            ''
            '### Which checks ran?'
            '- Ordinary pull requests and pushes: frontend + native validation; **no installer**'
            '- Full installer + video export + installed AI/uninstall: only an explicit full-windows-ci PR label or manual workflow_dispatch full_windows=true'
            ''
            'Request full Windows verification only for release candidates or a change that genuinely needs installed-app acceptance. Dispatching the workflow with its default input does **not** build an installer.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY


  windows:
    name: Build on Windows (full verification)
    # Packaging is always opt-in: ordinary PRs and main pushes run checks only.
    # A maintainer can explicitly request packaging via a PR label or manual input.
    if: (github.event_name == 'workflow_dispatch' && inputs.full_windows) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-windows-ci'))
    needs: [frontend, rust]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-installer
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ai-model-cache
          key: ai-models-v1-${{ hashFiles('config/ai-models.json') }}
      - name: Verify bundled AI models (cached)
        run: npm run prepare:models
      - uses: actions/cache@v6.1.0
        with:
          path: src-tauri/target/ve
          key: video-engine-windows-v1-${{ hashFiles('scripts/prepare-video-engine.ps1') }}
      - name: Prepare bundled video engine (cached)
        run: npm run prepare:video
      - run: npm run tauri icon assets/app-icon.svg
      - name: Build Windows desktop installer
        run: npm run tauri build -- -- --locked
      - name: Measure release video export
        shell: pwsh
        run: ./scripts/accept-video.ps1 -OutputDirectory "$env:RUNNER_TEMP/openphoto-video-acceptance" -MachineLabel "GitHub Windows 2022 runner"
      - name: Verify installed AI and uninstall lifecycle
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-installed-app.ps1 -Installer "src-tauri/target/release/bundle/nsis/Open-Photo_${version}_x64-setup.exe" -ReportDirectory "$env:RUNNER_TEMP/openphoto-installed-acceptance"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: open-photo-installed-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/openphoto-installed-acceptance/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: open-photo-video-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/openphoto-video-acceptance/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          compression-level: 0
          name: open-photo-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
